# Installs dependencies for Annolid managed by Conda (Python >= 3.10).
#
name: annolid
#prefix: /path/to/my/envs/annolid-env
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python>=3.10
  - pip
  - cython
  - pytorch::torchvision>=0.19
  - pytorch::pytorch>=2.5
  - cudatoolkit
  - cudnn
  - ffmpeg
  - matplotlib
  - git
  - curl
  - pyside6
  - qtpy
  - opencv
  - numpy>=1.24
  - scipy>=1.5.2
  - easydict>=1.9
  - pip:
    - pillow>=8.3.1
    - imgviz>=1.7.5
    # needed on KDE/Qt envs for matplotlib
    - PyYAML>=5.3
    - pandas>=1.1.3
    - pycocotools>=2.0.2
    - tensorboard>=2.3.0
    - imageio>=2.8.0
    - imageio-ffmpeg>=0.4.2
    - -e .
