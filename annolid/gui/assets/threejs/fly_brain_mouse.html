  <style>

      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

<body>
  <p>Loading Drosophila connectome mouse simulation… <a id="launch-link" href="./two_mice.html?fly_brain=1">Open now</a></p>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (!params.has('fly_brain')) params.set('fly_brain', '1');
    const target = `./two_mice.html?${params.toString()}`;
    const link = document.getElementById('launch-link');
    if (link) link.href = target;
    window.location.replace(target);
  </script>
</body>
