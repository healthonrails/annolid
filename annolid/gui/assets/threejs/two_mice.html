<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Annolid: Photoreal Two-Mouse Open Field</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d8dad9;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }

    #c {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 56%, rgba(35, 39, 38, 0.24) 118%);
      box-shadow: inset 0 0 80px rgba(40, 45, 43, 0.18);
    }

    .hud {
      position: absolute;
      bottom: 28px;
      left: 28px;
      color: rgba(38, 35, 31, 0.88);
      font-size: 12px;
      border-left: 3px solid rgba(116, 102, 83, 0.74);
      padding: 12px 16px;
      background: linear-gradient(90deg, rgba(247, 243, 234, 0.82) 0%, rgba(247, 243, 234, 0.16) 100%);
      backdrop-filter: blur(6px);
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .hud h1 {
      margin: 0 0 10px 0;
      font-size: 13px;
      letter-spacing: 0.13em;
      color: #1f1d1a;
      text-transform: uppercase;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      width: 280px;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(86, 76, 63, 0.18);
      padding-bottom: 2px;
    }

    .label {
      color: rgba(80, 72, 60, 0.74);
    }

    .val {
      color: #2f3c30;
      font-weight: bold;
    }

    .val.alert {
      color: #7a3e34;
    }


    .lil-gui {
      --background-color: rgba(30, 30, 29, 0.88);
      --text-color: #f3eee5;
      --title-background-color: rgba(68, 63, 55, 0.94);
      --widget-color: rgba(80, 75, 66, 0.95);
      --hover-color: rgba(112, 102, 86, 0.95);
      --focus-color: rgba(146, 128, 102, 0.95);
      --font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .lil-gui.root {
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 30px rgba(20, 18, 16, 0.24);
      right: 20px !important;
      top: 20px !important;
      max-height: calc(100vh - 40px) !important;
      overflow-y: auto !important;
    }

    .lil-gui,
    .lil-gui * {
      transition-duration: 0.01s !important;
    }

    #scene-status { position: absolute; top: 24px; left: 28px; max-width: 380px;
      color: #333d37; font-size: 13px; pointer-events: none; }
    #scene-status:empty { display: none; }
    .simulation-note { font-size: 10px; letter-spacing: 0.02em; margin: -3px 0 12px; }
    @media (max-width: 680px) {
      .hud { left: 12px; bottom: 12px; padding: 8px 10px; }
      .data-row { width: 235px; }
      .lil-gui.root {
        right: 8px !important;
        top: 8px !important;
        max-width: 230px;
        max-height: calc(100vh - 16px) !important;
      }
    }
    body.dataset-capture .overlay,
    body.dataset-capture .hud,
    body.dataset-capture .lil-gui {
      display: none !important;
    }
  </style>
</head>

<body>
  <canvas id="c" aria-label="Interactive two-mouse open field simulation"></canvas>
  <div id="scene-status" role="status">Loading mouse models…</div>
  <div class="overlay"></div>
  <div class="hud">
    <h1>Open Field · Two Mice</h1>
    <p class="simulation-note">Procedural simulation · illustrative physiology</p>
    <div class="data-row"><span class="label">SUBJECT COUNT</span><span class="val" id="hud-count">0</span></div>
    <div class="data-row"><span class="label">STATE</span><span class="val" id="hud-state">--</span></div>
    <div class="data-row"><span class="label">EST. HEART RATE</span><span class="val alert" id="hud-hr">-- BPM</span></div>
    <div class="data-row"><span class="label">EST. RESPIRATION</span><span class="val" id="hud-resp">-- BPM</span></div>
    <div class="data-row"><span class="label">COORD XZ</span><span class="val" id="hud-coord">0.00, 0.00</span></div>
  </div>

  <script type="module">
    import('./two_mice_scene.js').catch(error => {
      console.error('Two-mouse scene failed to load:', error);
      document.getElementById('scene-status').textContent =
        'Could not load the 3D scene. Check WebGL support in this browser view, then reload.';
    });
  </script>
</body>
</html>
