metadata:
  template: rat_ncap
  species: rattus_norvegicus
  body_model: rat_v2
  notes:
    - Sites follow Rat v2 / rat-ncap MuJoCo site conventions (head, torso, pelvis, finger_sensor_L/R, toe_sensor_L/R).
